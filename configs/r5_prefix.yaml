# R5-prefix: 1h ablation — WTA4 + random-prefix training (orders output by importance)
run: {name: r5_prefix, out_dir: checkpoints, log_dir: logs}
data: {shard_dir: data/dialogue_clean}
train: {batch_size: 32, lr: 3.0e-4, warmup_steps: 1000, max_steps: 500000, max_seconds: 3600,
        log_every: 50, sample_every: 500, val_every: 1000, ckpt_every: 5000, keep_ckpts: 3}
thinker: {layers: 8, nhead: 8, ffn_dim: 4096, mode: query, n_hypotheses: 4, wta_eps: 0.05,
          k_ctx: 16, k_out: 64, ctx_tau: 0.5, slot_weight_decay: 0.5,
          k_out_random_prefix: true, k_out_min: 4, k_out_full_frac: 0.10,
          w_thought: 1.0, w_decoder: 0.5, codec_ckpt: checkpoints/m5_frontier/best.pt}
model: {d_model: 128, max_seq_len: 128}
