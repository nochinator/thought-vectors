# R3-L-mixed: 48M mixed-loss, completes the scale bracket.
# If L outpaces M-mixed at equal wall-clock, the 3-4h run uses L.
model:
  d_model: 128
  max_seq_len: 128
data:
  shard_dir: data/dialogue
train:
  batch_size: 32
  lr: 3.0e-4
  warmup_steps: 1000
  max_steps: 500000
  max_seconds: 3600
  log_every: 50
  sample_every: 500
  val_every: 1000
  ckpt_every: 5000
  keep_ckpts: 3
run:
  name: r3_L_48M_mixed
thinker:
  layers: 10
  nhead: 8
  ffn_dim: 5120
  mode: query
  k_ctx: 16
  k_out: 64
  ctx_tau: 0.0
  w_thought: 1.0
  w_decoder: 0.5
  codec_ckpt: checkpoints/m5_frontier/best.pt
