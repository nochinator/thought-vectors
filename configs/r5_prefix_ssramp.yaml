# R5-prefix-ssramp: 1h — SS ramp 0.0→0.7, warm-start from TF checkpoint, k_out=8
run: {name: r5_prefix_ssramp, out_dir: checkpoints, log_dir: logs}
data: {shard_dir: data/dialogue_combined}
train: {batch_size: 32, lr: 1.0e-4, warmup_steps: 500, max_steps: 500000, max_seconds: 3600,
        log_every: 50, sample_every: 500, val_every: 1000, ckpt_every: 5000, keep_ckpts: 3}
thinker: {layers: 8, nhead: 8, ffn_dim: 4096, mode: prefix, ss_prob: 0.0, ss_prob_end: 0.7,
          k_ctx: 8, k_out: 8, ctx_tau: 0.5,
          w_thought: 1.0, w_decoder: 0.5, codec_ckpt: checkpoints/m5_frontier/best.pt,
          thinker_init_from: checkpoints/r5_prefix_oasst/best.pt}
model: {d_model: 128, max_seq_len: 128}
