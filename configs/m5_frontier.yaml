# M5 "frontier": the best model trainable in ONE 12-hour run (hard cap).
# Sized by the 2026-06-11 ablation bracket (RESEARCH_LOG.md):
#   - d384 5+5: tied d256 at 25 min despite BS32 -> capacity wins over 12h
#   - anchor + nar_frac REJECTED (lose at equal wall-clock); NAR stays an
#     optional post-hoc fine-tune
#   - KL REJECTED from-scratch (E256 collapse); noise kept. VAE returns as a
#     fine-tune on the trained model if M4 needs it
#   - data is the length-jittered mix_uni: long-only data never engages the
#     thought channel (E256 collapse), short samples bootstrap it
#   - wall-clock LR schedule: max_seconds drives warmup/cosine exactly to 12h
model:
  predictor_monotone: true   # CE non-increasing in k -> graded tau knob (W6)
  d_model: 384
  nhead: 6
  ffn_dim: 2048
  enc_layers: 5
  dec_layers: 5
  max_seq_len: 256
  num_thoughts: 256
ksampler:
  mode: per_sample           # W3: the step-change — every sample at its own ratio
reg:
  noise_std: 0.05
  word_dropout: 0.3          # W7: rate scaled by k/len — top-end exactness,
  word_dropout_scaled: true  # no low-ratio penalty
data:
  shard_dir: data/mix_uni
train:
  batch_size: 32
  lr: 3.0e-4
  max_steps: 1000000          # never reached; max_seconds stops the run
  max_seconds: 43200          # 12h hard cap
  predictor_extra_k: 1
  predictor_log: true        # log1p(CE) MSE: calibrates the low-CE region
  log_every: 100
  sample_every: 2000
  val_every: 2000
  ckpt_every: 2000
run:
  name: m5_frontier
