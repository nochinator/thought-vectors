# M5 "frontier": the best model this card can train — everything combined.
# Breaks the original's documented ceilings on purpose:
#   - d_model 512 (their "256 is best" came from undertrained post-norm runs;
#     d is exactly what capped long-text quality at ~50-60% overlap)
#   - seq 256 on paragraph-scale data (they trained on sentence fragments)
#   - all refinements trained TOGETHER from step 0 instead of sequentially:
#     blended-k + full-k anchor + NAR-mixed batches + VAE-lite + predictor
# Expect to resume across multiple overnight sessions; recalibrate max_steps
# from the measured it/s. Final hyperparameters set after M1/M2 parity runs.
model:
  d_model: 512
  nhead: 8
  ffn_dim: 2048
  enc_layers: 6
  dec_layers: 6
  max_seq_len: 256
  num_thoughts: 256
ksampler:
  mode: blended
reg:
  kl_beta: 0.01
  kl_warmup_steps: 2000
  noise_std: 0.05
  mixup_prob: 0.1
  nar_frac: 0.25
data:
  shard_dir: data/mix_long
train:
  batch_size: 32
  lr: 2.5e-4
  warmup_steps: 2000
  max_steps: 100000
  predictor_extra_k: 2
  anchor_full_k_weight: 0.5
run:
  name: m5_frontier
