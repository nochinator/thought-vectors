# M5 "frontier": the best model trainable in ONE 12-hour run (hard cap).
# Everything combined, sized by the ablation bracket in RESEARCH_LOG.md:
#   - d/layers/seq below are CANDIDATES; the equal-wall-clock ablations decide
#   - all refinements trained TOGETHER from step 0 instead of sequentially:
#     blended-k + full-k anchor + NAR-mixed batches + VAE-lite + predictor
# max_steps = measured it/s x 12h x 3600, set just before launch.
model:
  d_model: 512
  nhead: 8
  ffn_dim: 2048
  enc_layers: 6
  dec_layers: 6
  max_seq_len: 256
  num_thoughts: 256
ksampler:
  mode: blended
reg:
  kl_beta: 0.01
  kl_warmup_steps: 2000
  noise_std: 0.05
  mixup_prob: 0.1
  nar_frac: 0.25
data:
  shard_dir: data/mix_long
train:
  batch_size: 32
  lr: 2.5e-4
  warmup_steps: 2000
  max_steps: 100000
  predictor_extra_k: 2
  anchor_full_k_weight: 0.5
run:
  name: m5_frontier
