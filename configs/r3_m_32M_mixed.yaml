# R3-M-mixed: the decisive experiment — 32M with mixed loss (thought + decoder CE).
# Answers: does scale close the cos gap at equal wall-clock, or is the frontier's
# 0.58 a product of 225K steps?  If cos > 0.53 with decodable output → scale wins.
model:
  d_model: 128
  max_seq_len: 128
data:
  shard_dir: data/dialogue
train:
  batch_size: 32
  lr: 3.0e-4
  warmup_steps: 1000
  max_steps: 500000
  max_seconds: 3600
  log_every: 50
  sample_every: 500
  val_every: 1000
  ckpt_every: 5000
  keep_ckpts: 3
run:
  name: r3_M_32M_mixed
thinker:
  layers: 8
  nhead: 8
  ffn_dim: 4096
  mode: query
  k_ctx: 16
  k_out: 48
  ctx_tau: 0.0                 # off — constant budget, clean comparison
  w_thought: 1.0
  w_decoder: 0.5
  codec_ckpt: checkpoints/m5_frontier/best.pt
