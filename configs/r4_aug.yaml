# R4-aug: + role swap (p=0.5) + turn dropout (p=0.15)
run: {name: r4_aug, out_dir: checkpoints, log_dir: logs}
data: {shard_dir: data/dialogue}
train: {batch_size: 32, lr: 3.0e-4, warmup_steps: 1000, max_steps: 500000, max_seconds: 3600,
        log_every: 50, sample_every: 500, val_every: 1000, ckpt_every: 5000, keep_ckpts: 3}
thinker: {layers: 8, nhead: 8, ffn_dim: 4096, mode: query, k_ctx: 16, k_out: 48,
          w_thought: 1.0, w_decoder: 0.5, role_flip: true, turn_dropout: 0.15,
          codec_ckpt: checkpoints/m5_frontier/best.pt}
model: {d_model: 128, max_seq_len: 128}
