# R4-perslot-wta: 3h — perslot + WTA4 + clean data
run: {name: r4_perslot_wta, out_dir: checkpoints, log_dir: logs}
data: {shard_dir: data/dialogue_clean}
train: {batch_size: 32, lr: 3.0e-4, warmup_steps: 1000, max_steps: 500000, max_seconds: 10800,
        log_every: 50, sample_every: 500, val_every: 2000, ckpt_every: 5000, keep_ckpts: 3}
thinker: {layers: 8, nhead: 8, ffn_dim: 4096, mode: query, n_hypotheses: 4, wta_eps: 0.05,
          k_ctx: 16, k_out: 32, ctx_tau: 0.5, slot_weight_decay: 0.5,
          w_thought: 1.0, w_decoder: 0.5, codec_ckpt: checkpoints/m5_frontier/best.pt}
model: {d_model: 128, max_seq_len: 128}
