[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thoughtvec"
version = "1.0.0"
description = "Thought vectors: ordered latent compression of text with prefix-decodable representations, and a thinker that converses in that latent space"
readme = "README.md"
requires-python = ">=3.12"
# torch is intentionally not listed: the wheel is backend-specific
# (ROCm vs CPU vs CUDA) — scripts/setup_env.sh installs the right one.
dependencies = [
    "numpy",
    "pyyaml",
    "sentencepiece",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
tv-train = "thoughtvec.cli:train_main"
tv-train-thinker = "thoughtvec.cli:train_thinker_main"
tv-eval = "thoughtvec.cli:eval_main"
tv-tokenizer = "thoughtvec.cli:tokenizer_main"
tv-pretokenize = "thoughtvec.cli:pretokenize_main"
tv-pretokenize-dialogue = "thoughtvec.cli:pretokenize_dialogue_main"
tv-chat = "thoughtvec.cli:chat_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
