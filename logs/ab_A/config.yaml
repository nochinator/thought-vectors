model:
  vocab_size: 16384
  d_model: 256
  nhead: 4
  ffn_dim: 2048
  enc_layers: 4
  dec_layers: 4
  dropout: 0.1
  thought_dropout: 0.1
  max_seq_len: 128
  num_thoughts: 128
  activation: gelu
  position_attn_bias: true
ksampler:
  mode: blended
  min_k: 2
  full_frac: 0.1
  uniform_frac: 0.45
  ratio_bands:
  - - 0.4
    - 0.6
    - 0.3
  - - 0.25
    - 0.4
    - 0.3
  - - 0.15
    - 0.25
    - 0.2
  - - 0.6
    - 1.5
    - 0.2
reg:
  kl_beta: 0.0
  kl_warmup_steps: 1000
  noise_std: 0.0
  mixup_prob: 0.0
  nar: false
  nar_frac: 0.0
data:
  shard_dir: data/c4_500k
  val_shard_dir: ''
  num_workers: 2
train:
  batch_size: 64
  grad_accum: 1
  lr: 0.0003
  weight_decay: 0.01
  warmup_steps: 1000
  max_steps: 1000000
  max_seconds: 1500
  min_lr_frac: 0.1
  grad_clip: 1.0
  predictor_weight: 1.0
  predictor_extra_k: 0
  anchor_full_k_weight: 0.0
  anchor_every: 1
  detach_encoder_below_k: 0
  amp: 'off'
  seed: 1234
  log_every: 100
  sample_every: 1000000
  val_every: 1000
  ckpt_every: 1000000
  keep_ckpts: 3
run:
  name: ab_A
  out_dir: checkpoints
  log_dir: logs
  tokenizer_path: artifacts/tokenizer/spm16k_bpe.model
  device: cuda
